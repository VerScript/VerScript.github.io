<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="VerScript Comprehensive Interactive Documentation — SPA Documentation with Live Code Execution and Practice Exercises.">
    <title>VerScript Documentation & Interactive Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07070a;
            --surface-color: #0f1015;
            --surface-card: rgba(22, 23, 31, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(0, 255, 204, 0.3);
            --primary: #00FFCC;
            --primary-glow: rgba(0, 255, 204, 0.25);
            --secondary: #9D00FF;
            --secondary-glow: rgba(157, 0, 255, 0.25);
            --accent-yellow: #FFD166;
            --accent-pink: #FF79C6;
            --accent-red: #EF476F;
            --accent-blue: #118AB2;
            --text-main: #FFFFFF;
            --text-muted: #9DA3AE;
            --sidebar-width: 320px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            -webkit-text-size-adjust: 100%;
            touch-action: pan-y;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.65;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            touch-action: pan-y;
            -webkit-font-smoothing: antialiased;
        }

        /* TOPBAR NAVIGATION */
        nav.topbar {
            height: 64px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(7, 7, 10, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 900;
            text-decoration: none;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .logo-badge {
            background: rgba(0, 255, 204, 0.12);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 204, 0.25);
            text-transform: uppercase;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .nav-btn-outline {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
        }
        .nav-btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(0, 255, 204, 0.06);
        }

        .nav-btn-primary {
            background: linear-gradient(90deg, var(--primary), #00d2ff);
            color: #08080C;
            font-weight: 700;
            box-shadow: 0 0 16px rgba(0, 255, 204, 0.3);
        }
        .nav-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 24px rgba(0, 255, 204, 0.5);
        }

        /* APP LAYOUT */
        .app-layout {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        /* SIDEBAR NAVIGATION */
        aside.sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background: #090a0e;
            border-right: 1px solid var(--border-color);
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
            padding: 20px 16px 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 80;
        }

        .search-box {
            position: relative;
            margin-bottom: 4px;
        }
        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        .progress-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.4s ease;
        }

        .sidebar-section-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--text-muted);
            padding: 8px 8px 4px;
        }

        .article-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .article-item-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .article-item-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }
        .article-item-btn.active {
            background: rgba(0, 255, 204, 0.08);
            border-color: rgba(0, 255, 204, 0.3);
            color: var(--primary);
            font-weight: 700;
        }
        .article-num {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-right: 8px;
            font-family: 'Fira Code', monospace;
        }
        .article-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--text-muted);
        }
        .article-status-dot.completed {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 6px var(--primary);
        }

        /* MAIN CONTENT AREA & TWEENED ANIMATIONS */
        main.content-area {
            flex: 1;
            padding: 40px 48px 80px;
            max-width: 980px;
            margin: 0 auto;
            position: relative;
        }

        .article-view-wrapper {
            animation: articleTweenIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: top center;
        }

        @keyframes articleTweenIn {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.99);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .article-header {
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            animation: headerSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes headerSlideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .article-item-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .article-item-btn:hover {
            transform: translateX(4px);
        }
        .article-item-btn.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-radius: 0 2px 2px 0;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .meta-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(157, 0, 255, 0.12);
            color: #C084FC;
            border: 1px solid rgba(157, 0, 255, 0.3);
        }
        .read-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        h1.article-title {
            font-size: clamp(2rem, 4vw, 2.6rem);
            font-weight: 900;
            margin: 0 0 12px;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .article-summary {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 300;
            margin: 0;
            line-height: 1.6;
        }

        /* ARTICLE BODY TYPOGRAPHY */
        .article-body h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 40px 0 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .article-body h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.1em;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .article-body h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 28px 0 12px;
            color: #E2E8F0;
        }

        .article-body p {
            color: #C5CAD3;
            font-size: 1.02rem;
            margin-bottom: 18px;
        }

        .article-body code {
            font-family: 'Fira Code', monospace;
            background: rgba(0, 255, 204, 0.08);
            color: var(--primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .callout-box {
            background: rgba(15, 16, 21, 0.7);
            border-left: 4px solid var(--primary);
            border-radius: 0 10px 10px 0;
            padding: 16px 20px;
            margin: 24px 0;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .callout-box.tip { border-left-color: var(--primary); }
        .callout-box.warn { border-left-color: var(--accent-yellow); }
        .callout-box.note { border-left-color: var(--secondary); }
        .callout-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .callout-box p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* TABLES */
        .doc-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            background: var(--surface-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .doc-table th, .doc-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .doc-table th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--primary);
            font-weight: 600;
        }
        .doc-table tr:last-child td { border-bottom: none; }

        /* LIVE RUNNABLE CODE BOX */
        .runbox-container {
            background: #0B0C10;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 28px 0;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s;
        }
        .runbox-container:focus-within {
            border-color: var(--border-highlight);
        }

        .runbox-header {
            background: #111218;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .runbox-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .window-dots {
            display: flex;
            gap: 6px;
        }
        .w-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .w-dot.red { background: #FF5F56; }
        .w-dot.yellow { background: #FFBD2E; }
        .w-dot.green { background: #27C93F; }

        .runbox-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s ease;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary);
        }
        .action-btn.run-btn {
            background: linear-gradient(90deg, #00FFCC, #00B4D8);
            color: #08080C;
            font-weight: 700;
            border: none;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .action-btn.run-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .code-editor-area {
            position: relative;
        }
        .code-textarea {
            width: 100%;
            height: 140px;
            background: transparent;
            color: #E2E8F0;
            font-family: 'Fira Code', monospace;
            font-size: 0.92rem;
            line-height: 1.5;
            padding: 16px;
            border: none;
            outline: none;
            resize: vertical;
            white-space: pre;
            tab-size: 4;
        }

        .runbox-console {
            background: #060709;
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            min-height: 48px;
            max-height: 180px;
            overflow-y: auto;
        }
        .console-header {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .console-output {
            margin: 0;
            white-space: pre-wrap;
            color: #A0AEC0;
        }
        .console-output.success { color: #48BB78; }
        .console-output.error { color: #F56565; }

        /* EXERCISES SECTION */
        .exercises-wrapper {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
        }
        .exercises-heading {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-yellow);
        }
        .exercises-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .exercise-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 24px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .exercise-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .exercise-card.completed {
            border-color: rgba(0, 255, 204, 0.4);
            box-shadow: 0 0 24px rgba(0, 255, 204, 0.12);
        }
        .exercise-card.completed .exercise-badge {
            background: rgba(0, 255, 204, 0.15);
            color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            animation: badgeBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes badgeBounce {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), #00d2ff);
            background-size: 200% 100%;
            animation: progressShimmer 3s infinite linear;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes progressShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .exercise-header {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exercise-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255, 209, 102, 0.15);
            color: var(--accent-yellow);
            transition: all 0.3s ease;
        }
        .exercise-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin: 0;
        }
        .exercise-body {
            padding: 20px;
        }
        .exercise-prompt {
            margin-bottom: 16px;
            color: #CBD5E1;
            font-size: 0.98rem;
        }

        .exercise-hints-toggle, .exercise-sol-toggle {
            background: none;
            border: none;
            color: var(--primary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin: 8px 12px 0 0;
            text-decoration: underline;
        }
        .exercise-hint-content, .exercise-sol-content {
            display: none;
            margin-top: 10px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: #A0AEC0;
        }

        /* PAGINATION FOOTER */
        .article-pagination {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }
        .page-nav-card {
            flex: 1;
            padding: 16px 20px;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .page-nav-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .page-nav-card.prev { text-align: left; }
        .page-nav-card.next { text-align: right; }
        .nav-card-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .nav-card-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
        }

        /* RESPONSIVENESS & MOBILE ACCESSIBILITY */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 85;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-backdrop.active {
            display: block;
            opacity: 1;
        }

        .doc-table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 16px 0;
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            nav.topbar {
                height: 56px;
                padding: 0 16px;
            }
            .nav-right .nav-btn-outline {
                display: none;
            }
            .hamburger-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                min-height: 44px;
                padding: 0;
                font-size: 1.4rem;
                touch-action: manipulation;
            }
            aside.sidebar {
                position: fixed;
                left: 0;
                top: 56px;
                bottom: 0;
                height: calc(100vh - 56px);
                width: 85vw;
                max-width: 320px;
                transform: translateX(-100%);
                transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: 20px 0 50px rgba(0,0,0,0.85);
                z-index: 90;
                -webkit-overflow-scrolling: touch;
            }
            aside.sidebar.open {
                transform: translateX(0);
            }
            main.content-area {
                padding: 20px 14px 60px 14px;
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }
            .article-header h1.article-title {
                font-size: 1.8rem;
